- tr: "*bir* kitap"
  ru: "*одна* книга"
- tr: "*iki* çocuk"
  ru: "*двое* детей"
  note: После числительного существительное стоит в единственном числе.
- tr: "*on bir*"
  ru: "*одиннадцать*"
  note: Буквально «десять один».
- tr: "*yüz* lira"
  ru: "*сто* лир"
  note: Перед yüz слово bir не ставят.
- tr: "*iki bin yirmi altı*"
  ru: "*две тысячи двадцать шесть*"
- tr: Saat *beş*.
  ru: Сейчас *пять* часов.
- tr: "*Üç* kardeşim var."
  ru: У меня *трое* братьев и сестёр.
  morphemes: üç kardeş-im var
  gloss: три брат.или.сестра-1ЕД.ПРИТ есть
- tr: Sınıfta *on iki* öğrenci var.
  ru: В классе *двенадцать* студентов.
  morphemes: sınıf-ta on iki öğrenci var
  gloss: класс-МЕСТ десять два студент есть
- tr: "*Yirmi beş* yaşındayım."
  ru: Мне *двадцать пять* лет.
  morphemes: yirmi beş yaş-ı-nda-yım
  gloss: двадцать пять возраст-3ЕД.ПРИТ-МЕСТ-1ЕД
  note: Буквально «я в возрасте двадцати пяти».
