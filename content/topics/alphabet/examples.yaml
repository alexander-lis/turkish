- tr: "*c*am"
  ru: стекло
  note: Буква c читается как «дж» — «джам».
- tr: "*ç*ay"
  ru: чай
  note: Буква ç читается как «ч».
- tr: "*ş*eker"
  ru: сахар
  note: Буква ş читается как «ш».
- tr: pla*j*
  ru: пляж
  note: Буква j читается как «ж» и встречается только в заимствованных словах.
- tr: k*ı*z
  ru: девочка
  note: Буква ı без точки читается как «ы».
- tr: "*İ*stanbul"
  ru: Стамбул
  note: Заглавная буква от i — İ с точкой.
- tr: g*ö*z
  ru: глаз
  note: Буква ö читается как «ё» в слове «тётя».
- tr: "*ü*ç"
  ru: три
  note: Буква ü читается как «ю» в слове «тюль».
- tr: da*ğ*
  ru: гора
  note: Буква ğ не произносится, а удлиняет гласную перед собой — «да-а».
- tr: Mer*h*aba!
  ru: Здравствуйте!
  note: Буква h произносится в любом месте слова.
