[project]
name = "turkish-grammar"
version = "0.1.0"
description = "Сервер турецкого грамматического справочника: проверка контента и API для чтения"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
turkish-grammar = "turkish_grammar.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
    "zeyrek==0.1.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "PTH", "N", "RUF"]
# RUF001–RUF003 ругаются на кириллицу в строках, докстрингах и комментариях.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# У морфологического анализатора нет аннотаций типов.
module = ["zeyrek"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
